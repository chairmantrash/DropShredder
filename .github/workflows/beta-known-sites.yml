name: DropShredder known-site beta observations

on:
  pull_request:
    branches: [release/security-performance-hardening]
    paths: ['.github/workflows/beta-known-sites.yml', 'tools/beta/known-sites*', 'tools/beta/stage-repaired.py', 'tools/beta/collect.py']

permissions:
  contents: read
  actions: read

jobs:
  known-live-sites:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/beta-policy-repair-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage the exact verified CI package without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/chairmantrash/DropShredder/actions/artifacts/11776283604/zip > repaired-ci-artifact.zip
          python3 tools/beta/stage-repaired.py repaired-ci-artifact.zip
      - name: Install isolated genuine native browser tooling
        run: |
          npm ci --prefix tools/browser-smoke
          node tools/browser-smoke/node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y scrot xdotool fonts-noto-core fonts-noto-cjk
          python3 tools/beta/collect.py
      - name: Observe every planned known public page before any further product repair
        timeout-minutes: 11
        env:
          DS_NATIVE_HEADED: '1'
          DS_SKIP_EXPANDED_LIVE: '1'
          DS_KNOWN_SITES: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node tools/browser-smoke/probe-native-beta.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dropshredder-known-site-beta-evidence
          path: |
            browser-smoke-results/
            tools/browser-smoke/beta-collector-manifest.json
          if-no-files-found: error
          retention-days: 90
