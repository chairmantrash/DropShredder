name: DropShredder CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/security-performance-hardening]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Security audit
        run: npm run audit:security
      - name: Chrome runtime conformance audit
        run: npm run audit:chrome-runtime
      - name: Intelligence data lint
        run: npm run lint:data
      - name: Professional AI-assisted engineering audit
        run: npm run audit:professional
      - name: Test forensic core
        run: npm test
      - name: Build extension
        run: npm run build
      - name: Build Chrome Store zip
        run: npm run zip
      - name: Audit generated extension
        run: npm run release:audit
      - name: Performance audit
        run: npm run audit:performance
      - name: Package Chrome Store zip
        uses: actions/upload-artifact@v4
        with:
          name: dropshredder-chrome-store
          path: .output/*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
      - name: Package unpacked build
        uses: actions/upload-artifact@v4
        with:
          name: dropshredder-chrome-mv3
          path: .output/chrome-mv3/**
          include-hidden-files: true
          if-no-files-found: error
