name: DropShredder accepted beta4 publication

on:
  pull_request:
    branches: [release/security-performance-hardening]
    paths: ['.github/workflows/beta-publish4.yml', 'tools/beta/prepare-beta4.py', 'tools/beta/BETA4-INSTALL-AND-REPORT.md']

permissions:
  contents: read
  actions: read

concurrency:
  group: dropshredder-v0.2.0-beta.4-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/reputation-and-detection-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Require the accepted source and all completed browser/live gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          def api(path): return json.loads(subprocess.check_output(['gh','api','repos/chairmantrash/DropShredder/'+path]))
          head='ac52c91f4e082fafc5ba7358aecdd39742d48adb'
          for id in [38402573466,38402573495,38402573498,38402573507]:
              run=api(f'actions/runs/{id}')
              assert run['head_sha']==head and run['status']=='completed' and run['conclusion']=='success', run
          paths=subprocess.check_output(['git','diff','--name-only',head,'HEAD'],text=True).splitlines()
          assert all(p.startswith(('workplane/','tools/beta/','tools/evaluation/')) or p in ['BETA-TESTING.md','README.md','.github/workflows/beta-publish4.yml','.github/workflows/beta-reputation-live.yml','.gitignore'] for p in paths), paths
          artifact=next(a for a in api('actions/runs/38402573498/artifacts')['artifacts'] if a['name']=='dropshredder-headed-permission-evidence')
          assert not artifact['expired'] and artifact['workflow_run']['head_sha']==head
          open('native-artifact.json','w').write(json.dumps(artifact))
          PY
      - name: Download the existing accepted ZIP and actual native/live observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/chairmantrash/DropShredder/actions/artifacts/11815875609/zip > accepted-ci-artifact.zip
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile,io
          a=json.loads(pathlib.Path('native-artifact.json').read_text())
          data=subprocess.check_output(['gh','api',f'repos/chairmantrash/DropShredder/actions/artifacts/{a["id"]}/zip'])
          assert hashlib.sha256(data).hexdigest()==a['digest'].removeprefix('sha256:')
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              name='native-probe.json'
              assert z.namelist().count(name)==1
              native=z.read(name)
              assert native==pathlib.Path('workplane/runs/DS-056-NATIVE-EVIDENCE/native-probe.json').read_bytes()
              pathlib.Path('accepted-native.json').write_bytes(native)
          PY
          python3 tools/beta/prepare-beta4.py accepted-ci-artifact.zip accepted-native.json
      - name: Require green CI and finding-free CodeQL on this publication head
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          for attempt in range(60):
              response=subprocess.check_output(['gh','api',f'repos/chairmantrash/DropShredder/actions/runs?head_sha={os.environ["BETA_HEAD"]}&event=pull_request&per_page=100'])
              latest={}
              for run in json.loads(response)['workflow_runs']:
                  if run['name'] in ['DropShredder CI','CodeQL']:latest.setdefault(run['name'],run)
              if len(latest)==2 and all(r['status']=='completed' for r in latest.values()):
                  assert all(r['conclusion']=='success' for r in latest.values()),latest
                  print(json.dumps({name:{'id':r['id'],'head':r['head_sha'],'conclusion':r['conclusion']} for name,r in latest.items()}));break
              time.sleep(5)
          else:raise SystemExit('Exact publication-head CI/CodeQL incomplete; no publication')
          PY
      - name: Publish beta4 through the existing authorized GitHub beta channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd beta4-packet
          sha256sum --check SHA256SUMS.txt
          if gh release view v0.2.0-beta.4 --repo chairmantrash/DropShredder > /dev/null 2>&1; then
            python3 - <<'PY'
          import json,subprocess
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/chairmantrash/DropShredder/'+path]))
          r=api('releases/tags/v0.2.0-beta.4');assert not r['draft'] and r['prerelease']
          a=next(a for a in r['assets'] if a['name']=='DropShredder-0.2.0-beta.4-chrome.zip')
          assert a['size']==25985652 and a['digest']=='sha256:84edf93835f4daa490402630f1801fd2b49f64f81dd8dafb72ac4f1b8020c752'
          assert api('git/ref/tags/v0.2.0-beta.4')['object']['sha']=='9aed11c9d26f79ba1f1824a92ccc1adec78905ce'
          print('Existing identical published beta4 retained; no overwrite')
          PY
          else
            gh release create v0.2.0-beta.4 ./* --repo chairmantrash/DropShredder --target 9aed11c9d26f79ba1f1824a92ccc1adec78905ce --prerelease --latest=false --draft --title 'DropShredder 0.2.0 beta 4 — attributed outside results and richer local evidence' --notes-file INSTALL-AND-REPORT.md
            gh release edit v0.2.0-beta.4 --repo chairmantrash/DropShredder --draft=false
          fi
          gh release view v0.2.0-beta.4 --repo chairmantrash/DropShredder --json url,isDraft,isPrerelease,tagName,assets
      - name: Verify the actual public downloads without authentication
        run: |
          python3 - <<'PY'
          import datetime,hashlib,io,json,pathlib,urllib.request,zipfile
          packet=pathlib.Path('beta4-packet');result={'authenticated':False,'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'assets':[]}
          base='https://github.com/chairmantrash/DropShredder/releases/download/v0.2.0-beta.4/'
          for p in sorted(packet.iterdir()):
              data=urllib.request.urlopen(base+p.name,timeout=60).read()
              assert data==p.read_bytes(),p.name
              result['assets'].append({'name':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              if p.suffix=='.zip':
                  build=json.loads((packet/'BUILD-INFO.json').read_text());expected={e['path']:e for e in build['buildFiles']}
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      assert len(z.namelist())==54 and set(z.namelist())==set(expected)
                      for name in z.namelist():
                          b=z.read(name);assert len(b)==expected[name]['bytes'] and hashlib.sha256(b).hexdigest()==expected[name]['sha256']
                  result['all54PublicPackageHashesMatch']=True
          (packet/'PUBLIC-DOWNLOAD-VERIFIED.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dropshredder-beta4-release-packet
          path: beta4-packet/
          if-no-files-found: error
          retention-days: 90

  fresh-public-retest:
    needs: publish
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/reputation-and-detection-20261013'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download actual public beta4 and verify all accepted bytes
        run: |
          python3 - <<'PYCODE'
          import hashlib,pathlib,urllib.request
          b=urllib.request.urlopen('https://github.com/chairmantrash/DropShredder/releases/download/v0.2.0-beta.4/DropShredder-0.2.0-beta.4-chrome.zip',timeout=60).read()
          assert hashlib.sha256(b).hexdigest()=='84edf93835f4daa490402630f1801fd2b49f64f81dd8dafb72ac4f1b8020c752'
          pathlib.Path('public-beta4.zip').write_bytes(b)
          m=pathlib.Path('tools/beta/reputation/public-beta4-targets.json').read_bytes()
          assert hashlib.sha256(m).hexdigest()=='a27c4f08e6a8a08527af77939d266ceaca0d7fd335c787b0d16a57802fb76cd3'
          pathlib.Path('frozen-targets.json').write_bytes(m)
          PYCODE
          python3 tools/beta/reputation/stage-public.py public-beta4.zip
      - name: Install isolated genuine browser tooling
        run: |
          npm ci --prefix tools/browser-smoke
          node tools/browser-smoke/node_modules/playwright/cli.js install --with-deps chromium
          sudo apt-get install -y scrot xdotool fonts-noto-core fonts-noto-cjk
          python3 tools/beta/audit150/make-runner.py
      - name: Exercise the public package on every predeclared target
        env:
          DS_NATIVE_HEADED: '1'
          DS_OUTSIDE_LIVE: '1'
          AUDIT_SHARD: ${{ matrix.shard }}
          AUDIT_MANIFEST: frozen-targets.json
        run: xvfb-run -a -s '-screen 0 1920x1080x24' node tools/browser-smoke/probe-native-audit-beta.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ds057-public-live-${{ matrix.shard }}
          path: |
            browser-smoke-results/
            frozen-targets.json
          if-no-files-found: error
          retention-days: 90
