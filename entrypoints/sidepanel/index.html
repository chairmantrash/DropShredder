<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DropShredder</title>
  </head>
  <body>
    <main id="app">
      <header>
        <div class="eyebrow">DROP SHREDDER</div>
        <h1>Commerce forensics</h1>
        <p>Local-first. No account. No telemetry. Show the receipts.</p>
      </header>
      <button id="scan" type="button">HUNT THIS SHIT</button>
      <section class="feature-toggles">
        <label class="toggle-row">
          <span><strong>Auto Source Hunt</strong><small>Check DropShredder's indexed supplier/marketplace history on every scan.</small></span>
          <input id="auto-source-hunt" type="checkbox" />
        </label>
      </section>
      <p id="status" class="status">Ready to inspect the active page.</p>
      <section id="summary" class="summary"></section>
      <section id="hunt-actions" class="hunt-actions" hidden>
        <button id="hunt-sources" class="secondary" type="button">HUNT SOURCES</button>
        <button id="hunt-image" class="secondary" type="button">HUNT IMAGE</button>
        <button id="hunt-store" class="secondary" type="button">HUNT STORE</button>
        <button id="check-domain" class="secondary" type="button">CHECK DOMAIN AGE</button>
        <button id="reputation-sweep" class="secondary" type="button">REPUTATION SWEEP</button>
        <button id="policy-check" class="secondary" type="button">CHECK RETURN POLICY</button>
      </section>
      <section>
        <h2>THE RECEIPTS</h2>
        <div id="evidence" class="evidence"></div>
      </section>
      <details>
        <summary>Raw evidence report</summary>
        <pre id="raw" class="result" hidden></pre>
      </details>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
